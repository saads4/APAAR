# Launch everything:  cp .env.example .env  &&  docker compose up --build
# Web UI: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: sentinel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:${POSTGRES_PASSWORD:-sentinel}@db:5432/sentinel
      DATA_DIR: /srv/data
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
    volumes: [apidata:/srv/data]   # persists the Ed25519 signing key
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  pgdata:
  apidata:
